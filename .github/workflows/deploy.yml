name: Deploy invitación

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write # para pedir el token OIDC a GitHub
  contents: read

# Un solo despliegue/destrucción a la vez (comparten el mismo tfstate)
concurrency:
  group: invitacion-navidad-prod
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VERSION: "1.16.6"
  TF_DIR: infra/envs/prod
  TF_IN_AUTOMATION: "true"

jobs:
  infra:
    name: Terraform (infraestructura)
    runs-on: ubuntu-latest
    outputs:
      bucket_name: ${{ steps.out.outputs.bucket_name }}
      distribution_id: ${{ steps.out.outputs.distribution_id }}
      site_url: ${{ steps.out.outputs.site_url }}
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false # para leer los outputs limpios con -raw

      - name: Init
        run: terraform init -input=false

      - name: Formato y validación
        run: |
          terraform fmt -check -recursive ../../
          terraform validate

      - name: Plan
        run: terraform plan -input=false -out=tfplan

      - name: Apply
        run: terraform apply -input=false tfplan

      - name: Leer outputs
        id: out
        run: |
          echo "bucket_name=$(terraform output -raw bucket_name)"         >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw distribution_id)" >> "$GITHUB_OUTPUT"
          echo "site_url=$(terraform output -raw site_url)"               >> "$GITHUB_OUTPUT"

  site:
    name: Publicar tarjeta
    runs-on: ubuntu-latest
    needs: infra
    env:
      S3_BUCKET: ${{ needs.infra.outputs.bucket_name }}
      DISTRIBUTION_ID: ${{ needs.infra.outputs.distribution_id }}
      SITE_URL: ${{ needs.infra.outputs.site_url }}
      APPS_SCRIPT_URL: ${{ vars.APPS_SCRIPT_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validar configuración
        run: |
          for v in S3_BUCKET DISTRIBUTION_ID SITE_URL APPS_SCRIPT_URL; do
            if [ -z "${!v}" ]; then echo "::error::Falta $v"; exit 1; fi
          done
          [[ "$APPS_SCRIPT_URL" == https://script.google.com/* ]] || { echo "::error::APPS_SCRIPT_URL debe ser la URL /exec de Apps Script"; exit 1; }

      - name: Construir (inyectar configuración)
        run: |
          rm -rf dist && cp -r site dist
          SITE_URL="${SITE_URL%/}"
          sed -i "s|__APPS_SCRIPT_URL__|${APPS_SCRIPT_URL}|g; s|__SITE_URL__|${SITE_URL}|g" dist/index.html
          if grep -nE "__(APPS_SCRIPT_URL|SITE_URL)__" dist/index.html; then
            echo "::error::Quedaron placeholders sin reemplazar"; exit 1
          fi

      - name: Credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Subir a S3
        run: |
          # Archivos estáticos: caché de 1 día
          aws s3 sync dist/ "s3://${S3_BUCKET}/" --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=86400"
          # index.html: caché corta para que los cambios se vean rápido
          aws s3 cp dist/index.html "s3://${S3_BUCKET}/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public, max-age=300"

      - name: Invalidar caché de CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/*" \
            --query "Invalidation.Id" --output text

      - name: Resumen
        run: |
          {
            echo "### 🎄 Invitación publicada"
            echo "- URL base: ${SITE_URL}"
            echo "- Link de un invitado: \`${SITE_URL}/?t=TOKEN\`"
          } >> "$GITHUB_STEP_SUMMARY"